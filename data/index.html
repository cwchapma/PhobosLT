<!DOCTYPE html>
<html>

<head>
  <title>Phobos LapTimer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="favicon.ico">
  <!-- <link rel="stylesheet" type="text/css" href="style.css"> -->
  <link rel="stylesheet" type="text/css" href="bootstrap.min.css">
  <script src="jquery-3.7.1.min.js"></script>
  <script src="articulate.min.js"></script>
  <script src="smoothie.js"></script>
</head>

<body>
  <div class="container">
    <header class="d-flex pb-1 align-items-center">
      <img src="favicon.ico" alt="PLT" style="width:32px;" class="me-2">
      <span class="fs-2">
        Phobos LapTimer
      </span>
    </header>
    <ul class="nav nav-tabs">
      <li class="nav-item">
        <a class="nav-link active" aria-current="page" data-bs-toggle="tab" data-bs-target="#config" type="button"
          role="tab" onclick="openTab(event,'config')">Configuration</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" data-bs-toggle="tab" data-bs-target="#race" type="button" role="tab"  onclick="openTab(event,'race')"">Race</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" data-bs-toggle="tab" data-bs-target="#calib" type="button" role="tab"  onclick="openTab(event,'calib')">Calibration</a>
      </li>
    </ul>

    <div class="tab-content pb-3 pt-3" id="myTabContent">
      <div class="tab-pane fade show active" id="config" role="tabpanel" aria-labelledby="home-tab" tabindex="0">
        <form>

          <h4>Receiver</h4>
          <div class="row">
            <div id="bandChannelFreq" class="col-md-2">
              <label for="bandSelect" class="form-label">Band:</label>
              <select id="bandSelect" class="form-select">
                <option value="A">A</option>
                <option value="B">B</option>
                <option value="E">E</option>
                <option value="F">F</option>
                <option value="R">R</option>
                <option value="L">L</option>
              </select>
            </div>
            <div class="col-md-2">
              <label for="channelSelect" class="form-label">Channel: </label>
              <select id="channelSelect" class="form-select">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
              </select>
            </div>
          </div>
          <p>Frequency: <span id="freqOutput"></span></p>
          <hr />
          <h4>Lap Time</h4>
          <label for="minLap" class="form-label">Minimum Lap Time: </label>
          <div class="row">
            <div class="col-md-11">
              <input type="range" id="minLap" class="form-range" step="0.5" min="1" max="20" value="5.0"
                oninput="updateMinLap(value)">
            </div>
            <div class="col-md-1">
              <span id="minLapText" class="val">10.0s</span>
            </div>
          </div>
          <hr />
          <h4>Battery</h4>
          <label for="alarmThreshold" class="form-label">Battery Voltage Alarm Threshold: </label>
          <div class="row">
            <div class="col-sm-11">
              <input type="range" id="alarmThreshold" class="form-range" step="0.1" min="2.6" max="4.2" value="3.0"
                oninput="updateAlarmThreshold(value)">
            </div>
            <div class="col-sm-1">
              <span id="alarmThresholdText" class="val">3.6v</span>
            </div>
          </div>
          <hr />
          <h4>Announcer</h4>
          <div class="announcerParams">
            <label for="announcerSelect" class="form-label">Announcer Type: </label>
            <div class="col-sm-3">
              <select id="announcerSelect" class="form-select">
                <option value="none">None</option>
                <option value="beep">Beep</option>
                <option value="1lap">Lap Time</option>
                <option value="2lap">Two Consecutive Laps Time</option>
                <option value="3lap">Three Consecutive Laps Time</option>
              </select>
            </div>
            <label for="rate" class="form-label">Announcer Rate:</label>
            <div class="row">
              <div class="col-sm-11">
                <input class="form-range" type="range" min="0.1" max="2" step="0.1" id="rate" value="1.0"
                  oninput="updateAnnouncerRate(value)">
              </div>
              <div class="col-sm-1">
                <span id="announcerRateText" class="val">1.0</span>
              </div>
            </div>
            <!-- <label for="voiceSelect">Announcer Voice:</label>
        <div id="voiceSelect"></div> -->
            <label for="pname" class="form-label">Pilot name: </label>
            <div class="col-sm-3">
              <input type="text" id="pname" class="form-control" maxlength="20">
            </div>
          </div>
          <hr />
          <h4>WIFI</h4>
          <div class="row">
            <div class="col-sm-3">
              <label for="ssid" class="form-label" class="form-label">WiFi SSID: </label>
              <input type="text" id="ssid" class="form-control" maxlength="32">
            </div>
            <div class="col-sm-3">
              <label for="pwd" class="form-label" class="form-label">WiFi Password: </label>
              <input type="password" id="pwd" class="form-control" maxlength="32">
            </div>
          </div>
          <hr />
          <button onclick="saveConfig()" class="btn btn-primary">Save Configuration</button>
        </form>
      </div>
      <div class="tab-pane fade" id="race" role="tabpanel" aria-labelledby="profile-tab" tabindex="0">
        <div class="btn-group" role="group">
          <button id="startRaceButton" onclick="startRace()" class="btn btn-success">Start Race</button>
          <button id="stopRaceButton" onclick="stopRace()" class="btn btn-danger" disabled>Stop Race</button>
          <button onclick="clearLaps()" class="btn btn-warning">Clear Laps</button>
        </div>
        <span id="timer">00:00:00 s</span>
        <table id="lapTable" class="table">
          <thead>
            <tr>
              <th scope="col">Lap No</th>
              <th scope="col">Lap Time</th>
              <th scope="col">2 Lap Time</th>
              <th scope="col">3 Lap Time</th>
            </tr>
          </thead>
        </table>
      </div>
      <div class="tab-pane fade" id="calib" role="tabpanel" aria-labelledby="profile-tab" tabindex="0">
        <div>
          <label for="enter">Enter RSSI:</label>
          <span id="enterSpan" class="val">120</span>
          <input type="range" style="width:100%" min="50" max="255" step="1" id="enter" value="120"
            oninput="updateEnterRssi(this,value)">
        </div>
        <div>
          <label for="exit">Exit RSSI:</label>
          <span id="exitSpan" class="val">100</span>
          <input type="range" style="width:100%" min="50" max="255" step="1" id="exit" value="100"
            oninput="updateExitRssi(this,value)">
        </div>
        <button onclick="saveConfig()" class="btn btn-primary">Save RSSI Thresholds</button>
        <hr/>
        <div>
          <canvas id="rssiChart" style="height:300px;width:100%"></canvas>
        </div>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
  <script src="bootstrap.bundle.min.js"></script>
</body>

</html>
